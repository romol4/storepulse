name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # also on Windows, so multi-line steps stop at the first failure

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Format
        run: ruff format --check
      - name: Lint
        run: ruff check
      - name: Types
        run: mypy src/
      - name: Tests
        run: pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip "pip-audit>=2.7,<3"
      - name: Audit dependencies
        run: pip-audit -r requirements-dev.lock

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -f docker/Dockerfile -t storepulse:ci .
      - name: Refuses to start without a master key
        run: |
          if docker run --rm storepulse:ci > out.txt 2>&1; then
            echo "started without a master key"; exit 1
          fi
          grep -q "no master key" out.txt
      - name: Starts, reports healthy and prints a setup token
        run: |
          docker run -d --name sp -e STOREPULSE_MASTER_KEY="$(openssl rand -base64 48)" \
            -p 127.0.0.1:8000:8000 storepulse:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect sp --format '{{.State.Health.Status}}')" = healthy ] && break
            sleep 1
          done
          docker inspect sp --format '{{.State.Health.Status}}' | grep -qx healthy
          curl -fsS http://127.0.0.1:8000/healthz
          docker logs sp 2>&1 | grep -q "setup token:"
          [ "$(docker exec sp id -u)" = 10001 ]
          [ "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/)" = "http://127.0.0.1:8000/setup" ]
      - name: Container logs
        if: always()
        run: docker logs sp 2>&1 | grep -v "setup token" || true
