<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Storepulse{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Storepulse</a>
    {% if user %}
    <nav>
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Overview</a>
      <a href="/sources" {% if request.url.path == "/sources" %}aria-current="page"{% endif %}>Sources</a>
      <a href="/settings" {% if request.url.path == "/settings" %}aria-current="page"{% endif %}>Settings</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Storepulse {{ version }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
